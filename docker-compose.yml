services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: orderflow
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (http://localhost:15672, orderflow/orderflow)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders-api:
    build:
      context: .
      dockerfile: src/OrderFlow.Orders.Api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=orderflow_orders;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: orderflow
      RabbitMq__Password: orderflow
    restart: unless-stopped

  inventory-api:
    build:
      context: .
      dockerfile: src/OrderFlow.Inventory.Api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=orderflow_inventory;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: orderflow
      RabbitMq__Password: orderflow
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: src/OrderFlow.Notifications.Worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: orderflow
      RabbitMq__Password: orderflow
    restart: unless-stopped

volumes:
  pgdata:
